name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel into a clean environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python dist/*.whl

      - name: Smoke test
        run: |
          .venv/bin/rathflow --version
          .venv/bin/rathflow --help
          RATHFLOW_CONFIG_DIR="$RUNNER_TEMP/rathflow-cfg" \
            .venv/bin/python -m rathflow_cli.selftest

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Selftest and CLI smoke
        run: |
          npm test
          node src/selftest.js

      - name: Install the packed tarball into a clean prefix
        run: |
          npm pack
          npm install -g ./rathflow-cli-*.tgz --prefix "$RUNNER_TEMP/npm-prefix"
          "$RUNNER_TEMP/npm-prefix/bin/rathflow" --version
          "$RUNNER_TEMP/npm-prefix/bin/rathflow" --help > /dev/null
          RATHFLOW_CONFIG_DIR="$RUNNER_TEMP/rathflow-cfg" \
            "$RUNNER_TEMP/npm-prefix/bin/rathflow" config show
